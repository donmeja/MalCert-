<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MalCert Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f4f7fb;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{

width:400px;
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,.1);

}

.logo{

text-align:center;
margin-bottom:30px;

}

.logo-circle{

width:80px;
height:80px;
background:#16a34a;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:36px;
font-weight:bold;
color:white;
margin:auto;

}

.logo h2{

margin-top:15px;

}

.logo p{

color:#777;

}

.input-box{

margin-bottom:20px;

}

.input-box label{

display:block;
margin-bottom:8px;
font-weight:500;

}

.input-box input{

width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:10px;
outline:none;

}

.input-box input:focus{

border-color:#16a34a;

}

button{

width:100%;
padding:15px;
background:#16a34a;
border:none;
border-radius:10px;
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;

}

button:hover{

background:#15803d;

}

.footer{

margin-top:20px;
text-align:center;

}

.footer a{

color:#16a34a;
text-decoration:none;

}

.error{

color:red;
margin-top:10px;
text-align:center;

}

</style>

</head>
<body>

<div class="login-box">

<div class="logo">

<div class="logo-circle">

M

</div>

<h2>MalCert</h2>

<p>Student Login</p>

</div>

<div class="input-box">

<label>Email</label>

<input
type="email"
id="email"
placeholder="Enter email">

</div>

<div class="input-box">

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter password">

</div>

<button id="loginBtn">

Login

</button>

<div class="error" id="error"></div>

<div class="footer">

Don't have an account?

<a href="register.html">

Register

</a>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

import {

getAuth,
signInWithEmailAndPassword

} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

const firebaseConfig={

apiKey:"YOUR_API_KEY",

authDomain:"YOUR_PROJECT.firebaseapp.com",

projectId:"YOUR_PROJECT",

storageBucket:"YOUR_PROJECT.appspot.com",

messagingSenderId:"YOUR_SENDER",

appId:"YOUR_APP_ID"

};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

document.getElementById("loginBtn").onclick=()=>{

const email=document.getElementById("email").value;

const password=document.getElementById("password").value;

signInWithEmailAndPassword(auth,email,password)

.then(()=>{

localStorage.setItem("isLoggedIn","true");

location.href="index.html";

})

.catch(error=>{

document.getElementById("error").textContent=

error.message;

});

};

</script>

</body>
</html>
