<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | MalCert</title>

<link rel="stylesheet" href="style.css">

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

<link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    rel="stylesheet">

</head><body class="auth-page"><div class="auth-container">

    <div class="auth-card">

        <!-- LOGO -->

        <div class="auth-logo">

            <a href="login.html">

                <img src="logo.png" class="round-img">

            </a>

            <h1>MalCert</h1>

            <p>MSCE Learning Platform</p>

        </div>


        <!-- TITLE -->

        <div class="auth-title">

            <h2>Welcome Back</h2>

            <p>Login to continue your studies.</p>

        </div>


        <!-- LOGIN FORM -->

        <form id="loginForm">

            <!-- EMAIL -->

            <div class="input-group">

                <label for="loginEmail">
                    Email Address
                </label>

                <div class="auth-input">

                    <i class="fas fa-envelope"></i>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="auth-input">
    <i class="fas fa-envelope"></i>
    <input ...>
            </div>

                <label for="loginPassword">
                    Password
                </label>

                <div class="auth-input">

                    <i class="fas fa-lock"></i>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('loginPassword', this)"
                    >

                        <i class="fas fa-eye"></i>

                    </button>

                </div>

            </div>


            <!-- REMEMBER ME -->

            <div class="remember-row">

                <label>

                    <input
                        type="checkbox"
                        id="rememberMe"
                    >

                    Remember me

                </label>

                <a href="#" onclick="forgotPassword(event)">
                    Forgot password?
                </a>

            </div>


            <!-- MESSAGE -->

            <div
                id="loginMessage"
                class="auth-message"
            ></div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="auth-button"
            >

                <i class="fas fa-right-to-bracket"></i>

                Login

            </button>

        </form>


        <!-- REGISTER -->

        <div class="auth-footer">

            <p>
                Don't have an account?
                <a href="register.html">
                    Create Account
                </a>
            </p>

        </div>


        <!-- DEMO NOTICE -->

        <div class="demo-notice">

            <i class="fas fa-circle-info"></i>

            <span>
                This is the temporary MalCert login system.
                Firebase Authentication will be connected later.
            </span>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body></html>
