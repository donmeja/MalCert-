<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MalCert - Register</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f4f7fb;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.register-box{
width:450px;
background:#fff;
padding:40px;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,.1);
}

.logo{
text-align:center;
margin-bottom:30px;
}

.logo-circle{
width:80px;
height:80px;
border-radius:50%;
background:#16a34a;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
font-size:36px;
font-weight:bold;
margin:auto;
}

.logo h2{
margin-top:15px;
}

.logo p{
color:#777;
}

.input-box{
margin-bottom:18px;
}

.input-box label{
display:block;
margin-bottom:8px;
font-weight:500;
}

.input-box input,
.input-box select{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:10px;
outline:none;
font-size:15px;
}

.input-box input:focus,
.input-box select:focus{
border-color:#16a34a;
}

button{
width:100%;
padding:15px;
background:#16a34a;
color:#fff;
border:none;
border-radius:10px;
font-size:16px;
font-weight:600;
cursor:pointer;
}

button:hover{
background:#15803d;
}

.message{
margin-top:15px;
text-align:center;
color:red;
}

.footer{
margin-top:20px;
text-align:center;
}

.footer a{
text-decoration:none;
color:#16a34a;
font-weight:600;
}

</style>

</head>
<body>

<div class="register-box">

<div class="logo">
<div class="logo-circle">M</div>
<h2>Create Account</h2>
<p>Join MalCert Today</p>
</div>

<div class="input-box">
<label>Full Name</label>
<input type="text" id="name">
</div>

<div class="input-box">
<label>Email Address</label>
<input type="email" id="email">
</div>

<div class="input-box">
<label>Phone Number</label>
<input type="tel" id="phone">
</div>

<div class="input-box">
<label>Role</label>

<select id="role">
<option value="student">Student</option>
<option value="teacher">Teacher</option>
</select>

</div>

<div class="input-box">
<label>Password</label>
<input type="password" id="password">
</div>

<div class="input-box">
<label>Confirm Password</label>
<input type="password" id="confirmPassword">
</div>

<button id="registerBtn">
Create Account
</button>

<div class="message" id="message"></div>

<div class="footer">
Already have an account?
<a href="login.html">Login</a>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
import {
  getFirestore,
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAki1YOGefjDTDgXJ4qzc0Nwz_FwUo6998",
  authDomain: "malcert.firebaseapp.com",
  projectId: "malcert",
  storageBucket: "malcert.firebasestorage.app",
  messagingSenderId: "995694915586",
  appId: "1:995694915586:web:a78562d0b11b80144d371b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const registerBtn = document.getElementById("registerBtn");
const message = document.getElementById("message");

registerBtn.addEventListener("click", async () => {
  message.textContent = "";

  const fullName = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const role = document.getElementById("role").value;
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (!fullName || !email || !phone || !password || !confirmPassword) {
    message.textContent = "Please fill in all fields.";
    return;
  }

  if (password !== confirmPassword) {
    message.textContent = "Passwords do not match.";
    return;
  }

  try {
    const userCredential = await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );

    await setDoc(doc(db, "users", userCredential.user.uid), {
      name: fullName,
      email: email,
      phone: phone,
      role: role,
      createdAt: new Date()
    });

    alert("Registration successful!");
    window.location.href = "login.html";

  } catch (error) {
    console.error(error);
    message.textContent = error.code + ": " + error.message;
  }
});
</script>

</body>
</html>
