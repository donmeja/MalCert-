<!DOCTYPE html>
<html lang="en">
<head>
    <title>MalCert - Sign Up</title>

    <!-- REQUIRED for mobile & desktop scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #ff8c00;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
      /* Back Button */
        .back-button{
    position:fixed;
    top:15px;
    left:15px;
    color:black;
    text-decoration:none;
    font-size:34px;
    font-weight:bold;
    font-weight:bold;
    z-index:1000;

    background:transparent;
    border:none;
    outline:none;
    box-shadow:none;

    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
}

.back-button:hover,
.back-button:focus,
.back-button:active{
    background:transparent !important;
    outline:none;
    box-shadow:none;
    color:black;
}

        .container {
            width: 100%;
            max-width: 420px;   /* phone size */
            background: #ff8c00;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.25);
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .password-container {
            position: relative;
            width: 100%;
        }

        .password-container input {
            padding-right: 40px;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 18px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background: blue;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        .error-msg {
            color: red;
            margin-top: 10px;
        }

        p {
            margin-top: 15px;
        }

        a {
            color: purple;
            text-decoration: none;
            font-weight: bold;
        }

        /* DESKTOP VIEW */
        @media (min-width: 768px) {
            .container {
                max-width: 520px;
                padding: 40px;
            }

            h1 {
                font-size: 32px;
            }

            input {
                font-size: 18px;
            }

            button {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
  <a href="javascript:history.back()" class="back-button">&#8592;</a>

    <div class="container">
        <h1>Create Your Account</h1>

        <input type="text" id="name" placeholder="Full Name">
        <input type="email" id="email" placeholder="Email Address">

        <div class="password-container">
            <input type="password" id="password" placeholder="Password">
            <span class="toggle-password">👁</span>
        </div>

        <button id="signupBtn">Sign Up</button>

        <p id="errorMsg" class="error-msg"></p>

        <p>Already have an account? <a href="login.html">Login</a></p>
    </div>

    <script>
        // Toggle password visibility
const passwordInput = document.getElementById("password");
const togglePassword = document.querySelector(".toggle-password");

togglePassword.addEventListener("click", () => {
    passwordInput.type =
        passwordInput.type === "password" ? "text" : "password";
});

// Sign Up
document.getElementById("signupBtn").addEventListener("click", () => {

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const errorMsg = document.getElementById("errorMsg");

    errorMsg.textContent = "";

    if (!name || !email || !password) {
        errorMsg.textContent = "Please fill all fields.";
        return;
    }

    // Email validation
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!emailPattern.test(email)) {
        errorMsg.textContent = "Please enter a valid email address.";
        return;
    }

    // Password validation
    if (password.length < 8) {
        errorMsg.textContent = "Password must be at least 8 characters.";
        return;
    }

    if (!/[A-Z]/.test(password)) {
        errorMsg.textContent = "Password must contain at least one uppercase letter.";
        return;
    }

    if (!/[a-z]/.test(password)) {
        errorMsg.textContent = "Password must contain at least one lowercase letter.";
        return;
    }

    if (!/[0-9]/.test(password)) {
        errorMsg.textContent = "Password must contain at least one number.";
        return;
    }

    if (!/[!@#$%^&*(),.?":{}|<>]/.test(password)) {
        errorMsg.textContent = "Password must contain at least one special character.";
        return;
    }

    let users = JSON.parse(localStorage.getItem("users")) || [];

    if (users.some(user => user.email.toLowerCase() === email.toLowerCase())) {
        errorMsg.textContent = "Email already exists. Please login.";
        return;
    }

   users.push({
    name,
    email,
    password
});

localStorage.setItem("users", JSON.stringify(users));

// Automatically log the user in
localStorage.setItem("isLoggedIn", "true");
localStorage.setItem("studentName", name);
localStorage.setItem("studentEmail", email);

window.location.href = "welcome.html"; 
});
    </script>

</body>
</html>
