<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MalCert Subject</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#f4f7fb;
}

header{
background:#16a34a;
color:white;
padding:20px 40px;
display:flex;
justify-content:space-between;
align-items:center;
}

header h2{
font-size:28px;
}

header a{
color:white;
text-decoration:none;
font-weight:600;
}

.container{
max-width:1200px;
margin:auto;
padding:30px;
}

.subject-card{
background:white;
padding:30px;
border-radius:20px;
margin-bottom:30px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.subject-card h1{
margin-bottom:10px;
}

.subject-card p{
color:#666;
}

.filters{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.filters select,
.filters input{

padding:14px;
border-radius:10px;
border:1px solid #ddd;
outline:none;

}

.tabs{

display:flex;
gap:15px;
margin-bottom:30px;
flex-wrap:wrap;

}

.tab{

padding:12px 25px;
background:#ddd;
border-radius:30px;
cursor:pointer;
font-weight:600;

}

.tab.active{

background:#16a34a;
color:white;

}

.files{

display:grid;
gap:20px;

}

.file-card{

background:white;
padding:20px;
border-radius:18px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 10px 25px rgba(0,0,0,.08);

}

.file-info h3{

margin-bottom:6px;

}

.file-info small{

color:#777;

}

.download{

background:#16a34a;
color:white;
padding:12px 24px;
border:none;
border-radius:10px;
cursor:pointer;

}

.download:hover{

background:#15803d;

}

.empty{

background:white;
padding:60px;
border-radius:20px;
text-align:center;
color:#888;
display:none;

}

@media(max-width:700px){

header{

padding:20px;

}

.file-card{

flex-direction:column;
align-items:flex-start;
gap:15px;

}

.download{

width:100%;

}

}

</style>

</head>

<body>

<header>

<h2 id="subjectTitle">

Subject

</h2>

<a href="index.html">

<i class="fas fa-arrow-left"></i>

Back

</a>

</header>

<div class="container">

<div class="subject-card">

<h1 id="subjectHeading">

Loading...

</h1>

<p>

Browse Books, Notes and Past Papers.

</p>

</div>

<div class="filters">

<select id="level">

<option value="">

Select Class/Paper

</option>

<option value="Form 3">

Form 3

</option>

<option value="Form 4">

Form 4

</option>

<option value="Paper I">

Paper I

</option>

<option value="Paper II">

Paper II

</option>

<option value="Paper III">

Paper III

</option>

</select>

<select id="category">

<option value="Books">

Books</option>

<option value="Notes">

Notes</option>

<option value="Past Papers">

Past Papers</option>

</select>

<input
type="text"
id="search"
placeholder="Search file...">

</div>

<div class="tabs">

<div class="tab active"
data-category="Books">

Books

</div>

<div class="tab"
data-category="Notes">

Notes

</div>

<div class="tab"
data-category="Past Papers">

Past Papers

</div>

</div>

<div
class="files"
id="files">

</div>

<div
class="empty"
id="empty">

<h2>

No Files Found

</h2>

<p>

There are no resources available for this selection.

</p>

</div>

</div>

<script type="module" src="subject.js"></script>

</body>
</html>
