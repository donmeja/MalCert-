<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MalCert Teacher Upload</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#f5f7fb;
}

header{
background:#16a34a;
color:#fff;
padding:20px 40px;
display:flex;
justify-content:space-between;
align-items:center;
}

header a{
color:#fff;
text-decoration:none;
font-weight:600;
}

.container{
max-width:700px;
margin:40px auto;
padding:30px;
background:#fff;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h2{
margin-bottom:25px;
text-align:center;
}

.form-group{
margin-bottom:20px;
}

label{
display:block;
margin-bottom:8px;
font-weight:600;
}

input,
select{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:10px;
font-size:15px;
outline:none;
}

input:focus,
select:focus{
border-color:#16a34a;
}

button{
width:100%;
padding:15px;
background:#16a34a;
color:#fff;
border:none;
border-radius:10px;
font-size:16px;
font-weight:600;
cursor:pointer;
}

button:hover{
background:#15803d;
}

#progressBox{
display:none;
margin-top:20px;
}

progress{
width:100%;
height:20px;
}

#status{
margin-top:10px;
text-align:center;
font-weight:600;
}

</style>

</head>

<body>

<header>

<h2>Teacher Upload Portal</h2>

<a href="index.html">
<i class="fas fa-arrow-left"></i>
Dashboard
</a>

</header>

<div class="container">

<h2>Upload Learning Material</h2>

<div class="form-group">

<label>Subject</label>

<select id="subject">

<option value="">Select Subject</option>

<option>Additional Mathematics</option>
<option>Agriculture</option>
<option>Bible Knowledge</option>
<option>Biology</option>
<option>Business Studies</option>
<option>Chemistry</option>
<option>Chichewa</option>
<option>Computer Studies</option>
<option>English</option>
<option>Geography</option>
<option>History</option>
<option>Home Economics</option>
<option>Life Skills</option>
<option>Mathematics</option>
<option>Physics</option>
<option>Social Studies</option>

</select>

</div>

<div class="form-group" id="classGroup">

<label>Class</label>

<select id="level">

<option>Form 3</option>
<option>Form 4</option>

</select>

</div>

<div class="form-group" id="paperGroup" style="display:none;">

<label>Paper</label>

<select id="paper">

<option>Paper I</option>
<option>Paper II</option>
<option>Paper III</option>

</select>

</div>

<div class="form-group">

<label>Category</label>

<select id="category">

<option>Books</option>
<option>Notes</option>
<option>Past Papers</option>

</select>

</div>

<div class="form-group">

<label>Select File</label>

<input type="file" id="file">

</div>

<button id="uploadBtn">

<i class="fas fa-upload"></i>

Upload File

</button>

<div id="progressBox">

<progress
id="progress"
value="0"
max="100">

</progress>

<div id="status"></div>

</div>

</div>

<script type="module" src="teacher-upload.js"></script>

</body>
</html>
